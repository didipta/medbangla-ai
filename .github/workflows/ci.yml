name: MedBangla AI - Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Backend CI: Linting, Syntax Validation, and FastAPI Pytest Suite
  # =========================================================================
  backend-ci:
    name: Backend CI (Python 3.11 & FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies (OpenCV & ONNX Runtime support)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m compileall backend/app

      - name: Run Backend Integration & API Test Suite
        env:
          ENVIRONMENT: testing
          DEBUG: "False"
          SECRET_KEY: "ci-secret-key-for-automated-tests-only"
        run: |
          python -m pytest backend/scripts/test_api_endpoints.py backend/scripts/test_logging_and_errors.py -v

  # =========================================================================
  # 2. Frontend CI: Dependency Verification & Next.js 16 Production Build
  # =========================================================================
  frontend-ci:
    name: Frontend CI (Node 20 & Next.js 16)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps

      - name: Build Next.js Production Standalone App
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "340889956556-3286me1r8lfmiojisv7g2tre4n8h7bgg.apps.googleusercontent.com"
          NODE_ENV: production
        run: |
          npm run build

  # =========================================================================
  # 3. Docker Compose & Container Build Verification
  # =========================================================================
  docker-build-verification:
    name: Docker Build & Compose Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Test Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: medbangla-backend:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: medbangla-frontend:ci-test
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
