# =============================================================================
# MedBangla AI — Production Docker Compose Orchestration
# Services: Backend (FastAPI :8000) + Frontend (Next.js :3000)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Service: FastAPI + RapidOCR (ONNX) + RAG Engine + Drug Matrix
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medbangla-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - DATABASE_URL=${DATABASE_URL:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-medbangla_production_secret_key_change_me_123456}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      # Persistent log directory on the host
      - ./backend/logs:/app/logs
      # Read-only mount of medical document monographs and index
      - ./backend/data:/app/data:ro
    networks:
      - medbangla-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 2. Frontend Service: Next.js 16 Standalone (App Router + Tailwind CSS)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: medbangla-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
      - path: ./frontend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medbangla-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

# -----------------------------------------------------------------------------
# Shared Bridge Network for Inter-Container Communication
# -----------------------------------------------------------------------------
networks:
  medbangla-network:
    name: medbangla-network
    driver: bridge
